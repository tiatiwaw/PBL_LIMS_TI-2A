name: Deploy to RupaCloud (Laravel (Blade / Inertia React))

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Auto-Deploy to Container
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🌐 Persiapan Koneksi Cloudflare SSH (Bypass NAT/Firewall)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if echo "${{ secrets.SERVER_IP }}" | grep -qE '.[a-zA-Z]{2,}$'; then
            echo "Mengunduh client Cloudflare Tunnel untuk koneksi SSH..."
            sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
            cat << 'EOF' >> ~/.ssh/config
          Host *
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          else
            echo "Menggunakan koneksi IP langsung."
          fi

      - name: 🚀 SSH to RupaCloud Container & Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 root@$SERVER_HOST "bash -s" << 'REMOTE_SCRIPT_EOF'
            set -e
            export GIT_TERMINAL_PROMPT=0

            # 1. Sinkronisasi repositori git
            TARGET_REPO="${{ github.repository }}"
            CURRENT_REPO="$(cd ~/app 2>/dev/null && git config --get remote.origin.url 2>/dev/null || true)"
            if [ ! -d ~/app/.git ] || ! echo "$CURRENT_REPO" | grep -q "$TARGET_REPO"; then
              rm -rf ~/app
              git clone --depth 1 -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/app
              cd ~/app
            else
              cd ~/app
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git reset --hard HEAD 2>/dev/null || true
              git clean -fd 2>/dev/null || true
              git fetch --depth 1 origin main
              git checkout -B main FETCH_HEAD
              git reset --hard FETCH_HEAD
              git clean -fd
            fi

            # 2. Injeksi environment variables dari secrets
            if [ -n "$APP_ENV_CONTENT" ]; then
              echo "$APP_ENV_CONTENT" > .env
            fi

            # 3. Instalasi dependensi
            composer install --no-interaction --prefer-dist --optimize-autoloader; if [ -f package.json ]; then npm install; fi

            # 4. Persiapan ORM & framework cache
            if [ -f prisma/schema.prisma ] || grep -q '"prisma"' package.json 2>/dev/null; then
              npx prisma generate 2>/dev/null || true
            fi
            if [ -f artisan ]; then
              php artisan config:clear 2>/dev/null || true
            fi

            # 5. Build & kompilasi aplikasi
            export NODE_OPTIONS="--max-old-space-size=1200"
            if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi; if ! grep -q '^APP_KEY=' .env 2>/dev/null; then echo 'APP_KEY=' >> .env; fi; grep -q '^LARAVEL_CLOUD=' .env 2>/dev/null || echo 'LARAVEL_CLOUD=1' >> .env; php artisan key:generate --force 2>/dev/null || true; if [ -f package.json ]; then export NODE_OPTIONS='--max-old-space-size=1200'; npm run build; node -e 'const fs=require("fs"),f="public/build/manifest.json";if(fs.existsSync(f)){const d=JSON.parse(fs.readFileSync(f,"utf8"));let c=false;for(const k of Object.keys(d)){if(k.includes("resources/js/pages/")){const a=k.replace("resources/js/pages/","resources/js/Pages/");if(!d[a]){d[a]=d[k];c=true;}}else if(k.includes("resources/js/Pages/")){const a=k.replace("resources/js/Pages/","resources/js/pages/");if(!d[a]){d[a]=d[k];c=true;}}}if(c)fs.writeFileSync(f,JSON.stringify(d,null,2));}' 2>/dev/null || true; fi; chmod -R 775 storage bootstrap/cache 2>/dev/null || true; php artisan storage:link 2>/dev/null || true; if grep -q 'DB_CONNECTION=sqlite' .env 2>/dev/null || ! grep -q 'DB_CONNECTION=' .env 2>/dev/null; then mkdir -p database && touch database/database.sqlite 2>/dev/null || true; fi; php artisan migrate --force 2>/dev/null || true; php artisan optimize:clear 2>/dev/null || true; php artisan config:cache 2>/dev/null || true; php artisan route:cache 2>/dev/null || true; php artisan view:cache 2>/dev/null || true

            # 6. Konfigurasi Nginx reverse proxy
            if which nginx >/dev/null 2>&1; then
              echo "" | base64 -d > /etc/nginx/sites-available/default
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi

            # 7. Menjalankan proses aplikasi via PM2 & auto-resurrect on reboot
            pm2 delete app 2>/dev/null || true
            pm2 delete app 2>/dev/null || true; pm2 start "php artisan serve --host=0.0.0.0 --port=3000" --name app
            pm2 save 2>/dev/null || true
            pm2 startup systemd -u root --hp /root 2>/dev/null || true
            systemctl enable pm2-root 2>/dev/null || true

            echo "✔ Aplikasi berhasil diperbarui dan aktif berjalan di port 3000."
          REMOTE_SCRIPT_EOF
          rm -f ~/.ssh/deploy_key

      - name: 📊 Ringkasan Status Deployment (RuPa Cloud Summary)
        if: success()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ✅ Deployment Berhasil!
          Aplikasi **Laravel (Blade / Inertia React)** berhasil diperbarui dan aktif berjalan di container RuPa Cloud.

          | Parameter | Informasi |
          | :--- | :--- |
          | 📦 Framework | Laravel (Blade / Inertia React) |
          | 🌿 Branch | main |
          | 🔖 Commit SHA | ${{ github.sha }} |
          | 👤 Dipicu Oleh | ${{ github.actor }} |
          | ⏱️ Waktu Selesai | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          EOF

      - name: ⚠️ Ringkasan Kegagalan Deployment
        if: failure()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ❌ Deployment Gagal!
          Terjadi kendala saat proses deployment di container. Silakan periksa log step **🚀 SSH to RupaCloud Container & Deploy** di atas untuk melihat detail kesalahannya.
          EOF
