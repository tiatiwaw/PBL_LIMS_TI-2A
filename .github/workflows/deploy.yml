name: Deploy to RupaCloud (PHP Native / Procedural)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Auto-Deploy to Container
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🌐 Persiapan Koneksi Cloudflare SSH (Bypass NAT/Firewall)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if echo "${{ secrets.SERVER_IP }}" | grep -qE '.[a-zA-Z]{2,}$'; then
            echo "Mengunduh client Cloudflare Tunnel untuk koneksi SSH..."
            sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
            cat << 'EOF' >> ~/.ssh/config
          Host *
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          else
            echo "Menggunakan koneksi IP langsung."
          fi

      - name: 🚀 SSH to RupaCloud Container & Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          APP_ENV_B64=$(echo -n "$APP_ENV_CONTENT" | base64 -w 0)
          ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes root@$SERVER_HOST "APP_ENV_B64="$APP_ENV_B64" bash -s" << 'REMOTE_SCRIPT_EOF'
            set -e
            export GIT_TERMINAL_PROMPT=0

            # 1. Sinkronisasi repositori git
            TARGET_REPO="${{ github.repository }}"
            CURRENT_REPO="$(cd ~/app 2>/dev/null && git config --get remote.origin.url 2>/dev/null || true)"
            if [ ! -d ~/app/.git ] || ! echo "$CURRENT_REPO" | grep -q "$TARGET_REPO"; then
              rm -rf ~/app
              git clone --depth 1 -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/app
              cd ~/app
            else
              cd ~/app
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git reset --hard HEAD 2>/dev/null || true
              git clean -fd 2>/dev/null || true
              git fetch --depth 1 origin main
              git checkout -B main FETCH_HEAD
              git reset --hard FETCH_HEAD
              git clean -fd
            fi

            # 2. Injeksi environment variables dari secrets
            if [ -n "$APP_ENV_B64" ]; then
              echo "$APP_ENV_B64" | base64 -d > .env
            fi
            sed -i 's/\\n/\n/g' .env 2>/dev/null || true

            # 3. Instalasi dependensi
            export COMPOSER_ALLOW_SUPERUSER=1
            # Pastikan PHP & Composer terpasang di container
            wait_for_dpkg() { local c=0; while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/dpkg/lock >/dev/null 2>&1; do [ $c -ge 120 ] && break; echo "⏳ Menunggu dpkg lock..."; sleep 2; c=$((c+2)); done; }
            if ! which php >/dev/null 2>&1; then
              echo "⚠️ PHP belum terpasang. Memasang PHP 8.2 otomatis..."
              wait_for_dpkg
              export DEBIAN_FRONTEND=noninteractive
              curl -s 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x4F4EA0AAE5267A6C' | gpg --dearmor -o /etc/apt/trusted.gpg.d/ondrej-php.gpg 2>/dev/null || true
              echo 'deb https://ppa.launchpadcontent.net/ondrej/php/ubuntu jammy main' > /etc/apt/sources.list.d/ondrej-php.list
              apt-get update -qq && (apt-get install -y -qq php8.2-cli php8.2-mbstring php8.2-xml php8.2-curl php8.2-zip php8.2-sqlite3 php8.2-mysql php8.2-bcmath php8.2-intl unzip git || apt-get install -y -qq php-cli php-mbstring php-xml php-curl php-zip php-sqlite3 php-mysql php-bcmath php-intl unzip git)
              (update-alternatives --set php /usr/bin/php8.2 2>/dev/null || true)
            fi
            if ! which composer >/dev/null 2>&1; then
              echo "⚠️ Composer belum terpasang. Mengunduh Composer resmi..."
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              chmod +x /usr/local/bin/composer 2>/dev/null || true
            fi
            if [ -f package.json ] && ! which node >/dev/null 2>&1; then
              echo "⚠️ Node.js belum terpasang untuk frontend assets (Vite). Memasang Node.js LTS..."
              wait_for_dpkg
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y -qq nodejs
            fi
            composer install --no-interaction --prefer-dist 2>/dev/null || true

            # 4. Persiapan ORM & framework cache
            if [ -f prisma/schema.prisma ] || grep -q '"prisma"' package.json 2>/dev/null; then
              npx prisma generate 2>/dev/null || true
            fi
            if [ -f artisan ]; then
              if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi
              sed -i 's/\\n/\n/g' .env 2>/dev/null || true
              if ! grep -q '^APP_KEY=.\+' .env 2>/dev/null; then
                if ! grep -q '^APP_KEY=' .env 2>/dev/null; then echo '' >> .env; echo 'APP_KEY=' >> .env; fi
                php artisan key:generate --force 2>/dev/null || true
              fi
              php artisan config:clear 2>/dev/null || true
            fi

            # 6. Konfigurasi Nginx reverse proxy
            if which nginx >/dev/null 2>&1; then
              echo "" | base64 -d > /etc/nginx/sites-available/default
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi

            # 7. Menjalankan proses aplikasi via PM2 & auto-resurrect on reboot
            if ! which pm2 >/dev/null 2>&1; then
              if ! which node >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y -qq nodejs
              fi
              npm install -g pm2 --silent 2>/dev/null || true
            fi
            pm2 delete app 2>/dev/null || true
            pm2 delete app 2>/dev/null || true; pm2 start "php -S 0.0.0.0:3000" --name app
            pm2 save 2>/dev/null || true
            pm2 startup systemd -u root --hp /root 2>/dev/null || true
            systemctl enable pm2-root 2>/dev/null || true

            echo "✔ Aplikasi berhasil diperbarui dan aktif berjalan di port 3000."
          REMOTE_SCRIPT_EOF
          rm -f ~/.ssh/deploy_key

      - name: 📊 Ringkasan Status Deployment (RuPa Cloud Summary)
        if: success()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ✅ Deployment Berhasil!
          Aplikasi **PHP Native / Procedural** berhasil diperbarui dan aktif berjalan di container RuPa Cloud.

          | Parameter | Informasi |
          | :--- | :--- |
          | 📦 Framework | PHP Native / Procedural |
          | 🌿 Branch | main |
          | 🔖 Commit SHA | ${{ github.sha }} |
          | 👤 Dipicu Oleh | ${{ github.actor }} |
          | ⏱️ Waktu Selesai | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          EOF

      - name: ⚠️ Ringkasan Kegagalan Deployment
        if: failure()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ❌ Deployment Gagal!
          Terjadi kendala saat proses deployment di container. Silakan periksa log step **🚀 SSH to RupaCloud Container & Deploy** di atas untuk melihat detail kesalahannya.
          EOF
